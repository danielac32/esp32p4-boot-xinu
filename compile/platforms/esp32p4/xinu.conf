/* Configuration - (device configuration specifications) */
/* Unspecified switches default to ioerr                  */
/*  -i    init          -o    open      -c    close       */
/*  -r    read          -g    getc      -p    putc        */
/*  -w    write         -s    seek      -n    control     */
/*  -intr interrupt     -csr  csr       -irq  irq         */

/* "type" declarations for both real- and pseudo- devices */

/* null device */
null:
    on NOTHING  -i ionull       -o ionull        -c ionull
                -r ionull       -g ionull        -p ionull
                -w ionull

/* physical UART device (ESP32-P4 UART0) */
uart:
	on HARDWARE -i uartInit     -o ionull        -c ionull
	            -r uartRead     -g uartGetc      -p uartPutc
	            -w uartWrite    -n uartControl
                -intr uartInterrupt

/* tty pseudo-devices */
tty:
	on SOFTWARE -i ttyInit      -o ttyOpen       -c ttyClose
	            -r ttyRead      -g ttyGetc       -p ttyPutc
	            -w ttyWrite     -n ttyControl

/* PSRAM: initialized and mapped by the SBL; the device builds its free list */
psram:
	on HARDWARE -i psramInit

/* ST7796 320x480 LCD over an SPI master (all drawing goes through control) */
lcd:
	on HARDWARE -i lcdInit      -o ionull        -c ionull
	            -r ioerr        -g ioerr         -p ioerr
	            -w ioerr        -s ioerr         -n lcdControl

/* syntactic namespace: maps "/dev/<lower-case device name>" to devtab IDs */
nam:
	on SOFTWARE -i naminit      -o namopen       -c ioerr
	            -r ioerr        -g ioerr         -p ioerr
	            -w ioerr        -s ioerr         -n ioerr

/* microSD on SDMMC host slot 0.  Transfers are 512 byte blocks in either
 * direction; the character interface does not exist.  No csr: the driver
 * reaches the controller through the fixed SDHOST_BASE. */
sdmmc:
	on HARDWARE -i sdmmcInit    -o sdmmcOpen     -c sdmmcClose
	            -r sdmmcRead    -g ioerr         -p ioerr
	            -w sdmmcWrite   -s sdmmcSeek     -n sdmmcControl

/* the card on that slot: SD protocol over the sdmmc device, consumed by the
 * FAT library and the `sd` shell command */
sdblock:
	on HARDWARE -i sdblkInit    -o sdblkOpen     -c sdblkClose
	            -r sdblkRead    -g ioerr         -p ioerr
	            -w sdblkWrite   -s sdblkSeek     -n sdblkControl

/* FAT volume on the card.  It is a library (fatfs/) under a monitor, not a
 * stream: user code calls fl_* and asks the device only for its state. */
fat:
	on HARDWARE -i fatInit      -n fatControl

/* GPIO (ESP32-P4 GPIO + IO_MUX; raw driver in device/gpio) */
gpio:
	on HARDWARE -i gpioInit     -n gpioControl

/* I2C0 master bus (raw driver in device/i2c; shared by touch/audio/PMIC) */
i2c:
	on HARDWARE -i i2cInit      -n i2cControl

/* capacitive touch panel (FT6336 on the shared I2C0 bus; polled, no IRQ) */
touch:
	on HARDWARE -i touchInit    -o ionull        -c ionull
	            -r touchRead    -g ioerr         -p ioerr
	            -w ioerr        -s ioerr         -n touchControl

/* AXP2101 PMIC en el mismo bus I2C0: medidor de bateria.  Solo control() y
 * solo lecturas; el PMIC manda el rail de 3V3 y puede apagar el SoC. */
power:
	on HARDWARE -i powerInit    -n powerControl

/* ES8311 en ese bus.  Ademas de su control por I2C (volumen, mute, ganancia
 * del micro) el device mueve PCM por I2S+AHB-DMA: write() monta el anillo de
 * reproduccion y read() vacia el de captura, asi que los dos van en la fila.
 * Sin -o/-c la fila saldria con ioerr en open/close y getdev()/close() de la
 * shell no tendrian con quien hablar. */
audio:
	on HARDWARE -i audioInit    -n audioControl
	            -o ionull       -c ionull
	            -r audioRead    -w audioWrite
	            -g ioerr        -p ioerr        -s ioerr

/* W3: ETH0, la interfaz de red del ESP32-C6.  read() entrega UNA trama
 * Ethernet cruda (el transporte de device/sdio-esp32p4 ya quito la cabecera
 * hosted de 12 bytes) y write() baja una trama completa; encima de ellas
 * trabaja la pila nativa de Xinu portada de xinu-s3-amp (network/ +
 * device/tcp + device/udp), que es la que implementa ARP/IPv4/ICMP/UDP/TCP.
 * Sin csr ni irq: el C6 cuelga del slot 1 del controlador SDMMC y se bombea
 * por polling desde el propio read(). */
espeth:
	on HARDWARE -i espethInit   -o espethOpen    -c espethClose
	            -r espethRead   -g ioerr         -p ioerr
	            -w espethWrite  -n espethControl

/* Sockets de protocolo IPv4 crudo (proto != TCP/UDP).  ipv4Recv() los usa
 * solo para lo que no conoce; con NRAW=2 quedan dos ranuras. */
raw:
	on SOFTWARE -i rawInit      -o rawOpen       -c rawClose
	            -r rawRead      -g ioerr         -p ioerr
	            -w rawWrite     -n rawControl

/* Socket UDP: cada instancia es una PCB de udptab[NUDP].  Va "on NET" para
 * que el generador lo cuelgue del middleware de red. */
udp:
	on NET      -i udpInit      -o udpOpen       -c udpClose
	            -r udpRead      -g ioerr         -p ioerr
	            -w udpWrite     -n udpControl

/* Socket TCP: cada instancia es un TCB de tcptab[NTCP]. */
tcp:
	on SOFTWARE -i tcpInit      -o tcpOpen       -c tcpClose
	            -r tcpRead      -g tcpGetc       -p tcpPutc
	            -w tcpWrite     -n tcpControl

/* Terminal telnet: device/telnet (portado de xinu-s3-amp) cocina la sesion
 * (eco, CR/LF, IAC) sobre una conexion TCP y se usa como stdin/stdout del
 * shell del cliente.  "on TCP" es informativo para confgen; lo que cuenta es
 * el numero de instancias, que fija NTELNET. */
telnet:
	on TCP      -i telnetInit   -o telnetOpen    -c telnetClose
	            -r telnetRead   -g telnetGetc    -w telnetWrite
	            -p telnetPutc   -n telnetControl

%%

/* ESP32-P4 UART0: base UART0_BASE, CLIC line UART0_IRQn (both in esp32p4.h) */
SERIAL0   is uart     on HARDWARE csr UART0_BASE irq UART0_IRQn

DEVNULL   is null     on NOTHING

/* TTY for SERIAL0  */
CONSOLE   is tty      on SOFTWARE

PSRAM0    is psram    on HARDWARE

/* ST7796 panel: SPI2 master (SPI2_BASE in esp32p4.h).  The panel's DC/RST/BL
 * lines and the SPI clock/MOSI are routed by the driver through the GPIO
 * matrix using the pins declared in board.h. */
LCD0      is lcd      on HARDWARE csr SPI2_BASE

/* SDMMC host: slot 0 of the shared controller (SDHOST_BASE in esp32p4.h),
 * pads, clock tree and the IDMAC.  Slot 1 of the same block belongs to the
 * ESP32-C6, which is why every transaction takes the kernel's shared bus
 * lock.  Declared before SD0: the card device opens it at init. */
SDMMC0    is sdmmc    on HARDWARE

/* The microSD card in that socket: a 512 byte block device. */
SD0       is sdblock  on HARDWARE

/* The FAT volume that card carries.  Declared after SD0: its init opens the
 * card device and mounts (or formats) the volume. */
FAT0      is fat      on HARDWARE

/* GPIO controller: ESP32-P4 GPIO + IO_MUX (raw driver in device/gpio). */
GPIO0     is gpio     on HARDWARE

/* I2C0 master bus: shared by touch (FT6336/GT911) and the ES8311 codec
 * (plus the AXP2101 PMIC); raw driver in device/i2c. */
I2C0      is i2c      on HARDWARE

/* FT6336 touch panel on that bus: read() hands out touch_point_t records.
 * Declared after I2C0: its init pulses TP_RST and probes the bus. */
TOUCH0    is touch    on HARDWARE

/* AXP2101 PMIC (AXP2101_ADDR in board.h) en ese bus: porcentaje de bateria,
 * tension de la celda y estado del cargador.  Declared after I2C0 too: sus
 * lecturas salen del bus por control(I2C0, ...). */
POWER0    is power    on HARDWARE

/* ES8311 (ES8311_ADDR0 en board.h, CE a masa) en ese mismo bus.  Declared
 * after I2C0: sus unicas accesos son transacciones de registro por I2C. */
AUDIO0    is audio    on HARDWARE

/* W3: el enlace del C6.  El nombre tiene que ser ETH0: network/dhcpc y
 * xsh_netup.c comprueban que el descriptor este en
 * [ETH0, ETH0 + NETHER). */
ETH0      is espeth   on HARDWARE

/* Ranuras de socket.  La tabla real es tcptab[NTCP] / udptab[NUDP] /
 * rawtab[NRAW]; el devtab solo da nombre e indice (devptr->minor). */
RAW0      is raw      on SOFTWARE
RAW1      is raw      on SOFTWARE
UDP0      is udp      on NET
UDP1      is udp      on NET
TCP0      is tcp      on SOFTWARE
TCP1      is tcp      on SOFTWARE
TCP2      is tcp      on SOFTWARE
TCP3      is tcp      on SOFTWARE
TCP4      is tcp      on SOFTWARE
TCP5      is tcp      on SOFTWARE
TCP6      is tcp      on SOFTWARE
TCP7      is tcp      on SOFTWARE
TCP8      is tcp      on SOFTWARE
TCP9      is tcp      on SOFTWARE

/* Terminales telnet: uno por cliente atendido por el servidor (vease
 * shell/xsh_telnetserver.c, que hace telnetAlloc() por hilo y limita -n a
 * NTELNET).  Igual que en xinu-s3-amp: cuatro ranuras. */
TELNET0   is telnet   on TCP
TELNET1   is telnet   on TCP
TELNET2   is telnet   on TCP
TELNET3   is telnet   on TCP

/* Syntactic namespace.  Keep it last: the devices mounted before it keep
 * their existing IDs, and their init() has already run when naminit()
 * walks the device table. */
NAMESPACE is nam      on SOFTWARE

%%

/* The device table below binds devices to SoC registers symbolically
 * (UART0_BASE, UART0_IRQn, ...).  Those symbols come from the ESP32-P4
 * register map, so make it visible to conf.h (and hence to conf.c). */
#include <esp32p4.h>

#define IRQ_TIMER     7

/* Configuration and Size Constants */

#ifndef LITTLE_ENDIAN
#define LITTLE_ENDIAN 0x1234
#define BIG_ENDIAN    0x4321
#endif

#ifndef BYTE_ORDER
#define BYTE_ORDER    LITTLE_ENDIAN
#endif

#define NTHREAD   100           /* number of user threads           */
#define NSEM      100           /* number of semaphores             */
#define NMON      20             /* number of monitors               */
#define NMUTEX    20            /* number of non-recursive mutexes  */
#define NMQUEUE   20            /* number of variable-size queues    */
#define NMAILBOX  10           /* number of mailboxes              */
/* NMAILBOX>0 es obligatorio con la pila: network/{arp,icmp,route} llaman a
 * mailboxAlloc() en arpInit/icmpInit/rtInit, y mailboxInit() (que crea el
 * semaforo de la tabla) solo se invoca desde system/initialize.c bajo
 * #if NMAILBOX. */
#define RTCLOCK   TRUE          /* timer support                    */
#define NETEMU    FALSE         /* Network Emulator support         */
#define NVRAM     FALSE         /* nvram support                    */
#define SB_BUS    FALSE         /* Silicon Backplane support        */
#define USE_TLB   FALSE         /* make use of TLB                  */
#define USE_TAR   FALSE         /* enable data archives             */
#define NPOOL     8             /* number of buffer pools available */
#define POOL_MAX_BUFSIZE 2048   /* max size of a buffer in a pool   */
#define POOL_MIN_BUFSIZE 8      /* min size of a buffer in a pool   */
#define POOL_MAX_NBUFS   8192   /* max number of buffers in a pool  */
#define NUART     1
#define UART_FIFO_LEN   128

/* ------------------------------------------------------------------
 * W3: red nativa Xinu sobre el ESP32-C6.
 *
 * NETHER es el numero de interfaces de red y es lo que activa la pila de
 * network/ (los ficheros estan envueltos en #if NETHER).  No se deriva del
 * devtab porque el tipo de device se llama espeth, no ether, asi que se
 * escribe a mano -- igual que en el puerto ESP32-S3.  Los valores de
 * NUDP/NTCP/NRAW tienen que coincidir con las instancias declaradas arriba:
 * el generador del conf tambien los emite por su cuenta.
 * ------------------------------------------------------------------ */
#define NETHER    1             /* una interfaz: el C6                 */
#define NNETIF    1             /* idem, la tabla netiftab[]           */
#define NUDP      2             /* UDP0..UDP1                          */
#define NTCP      10            /* TCP0..TCP9                          */
#define NRAW      2             /* RAW0..RAW1                          */
#define NTELNET   4             /* TELNET0..TELNET3                    */
#define WITH_DHCPC              /* cliente DHCP para `netup ETH0'      */
